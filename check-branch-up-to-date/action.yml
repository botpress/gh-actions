name: Check branch is up to date
description: Fails when the checked-out ref does not include the latest base branch commit.

inputs:
  base-branch:
    description: 'Base branch that HEAD must include'
    required: false
    default: 'master'

runs:
  using: composite
  steps:
    - name: Check branch is up to date with base branch
      shell: bash
      run: |
        BASE_BRANCH="${{ inputs['base-branch'] }}"
        if [ -z "$BASE_BRANCH" ]; then
          echo "base-branch input cannot be empty."
          exit 1
        fi

        REMOTE_REF="origin/$BASE_BRANCH"

        git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"

        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --unshallow origin
          git fetch --no-tags origin "+refs/heads/$BASE_BRANCH:refs/remotes/origin/$BASE_BRANCH"
        fi

        if ! git rev-parse --verify "$REMOTE_REF" >/dev/null; then
          echo "Failed to fetch $REMOTE_REF. Cannot verify branch freshness."
          exit 1
        fi

        if ! git merge-base --is-ancestor "$REMOTE_REF" HEAD; then
          echo "This branch is not up to date with $BASE_BRANCH. Rebase or merge $BASE_BRANCH before deploying."
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Latest $BASE_BRANCH: $(git rev-parse "$REMOTE_REF")"
          exit 1
        fi

        echo "Branch is up to date with $BASE_BRANCH."
