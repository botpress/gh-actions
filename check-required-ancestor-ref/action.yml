name: Check required ancestor ref
description: Fails when the checked-out ref does not include the required ancestor ref.

inputs:
  required-ancestor-ref:
    description: 'Ref that HEAD must include'
    required: true

runs:
  using: composite
  steps:
    - name: Check required ancestor ref
      shell: bash
      run: |
        REQUIRED_ANCESTOR_REF="${{ inputs['required-ancestor-ref'] }}"
        if [ -z "$REQUIRED_ANCESTOR_REF" ]; then
          echo "required-ancestor-ref input cannot be empty."
          exit 1
        fi

        git fetch --no-tags origin "$REQUIRED_ANCESTOR_REF"

        if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
          git fetch --no-tags --unshallow origin
          git fetch --no-tags origin "$REQUIRED_ANCESTOR_REF"
        fi

        if ! git rev-parse --verify FETCH_HEAD >/dev/null; then
          echo "Failed to fetch $REQUIRED_ANCESTOR_REF. Cannot verify branch freshness."
          exit 1
        fi

        if ! git merge-base --is-ancestor FETCH_HEAD HEAD; then
          echo "This branch does not include $REQUIRED_ANCESTOR_REF. Rebase or merge it before deploying."
          echo "Current HEAD: $(git rev-parse HEAD)"
          echo "Required ancestor: $(git rev-parse FETCH_HEAD)"
          exit 1
        fi

        echo "Branch includes $REQUIRED_ANCESTOR_REF."
