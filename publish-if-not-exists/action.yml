name: Publish If Not Exists
description: Publishes a local package if it doesn't already exist on NPM Registry

inputs:
  path:
    description: Path to the package to publish
    required: true

  token:
    description: NPM access token. Omit to use OIDC login (Trusted Publisher)
    required: false
    default: ''

  package_manager:
    description: Package manager to use for publishing. Can be 'npm' or 'pnpm'
    required: false
    default: 'npm'

  provenance:
    description: |
      Set to 'false' to publish without a provenance attestation, or 'true' to publish
      with one. Leave empty to let the package manager decide, which it does from the
      repository visibility and the CI environment. The NPM_CONFIG_PROVENANCE and
      PNPM_CONFIG_PROVENANCE environment variables are honoured the same way, and
      'false' wins whenever both preferences are given.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Install JQ
      shell: bash
      run: sudo apt-get install jq

    - name: '[OIDC] Setup Node and registry'
      if: inputs.token == ''
      uses: actions/setup-node@v6
      with:
        node-version: '24.x'
        registry-url: 'https://registry.npmjs.org'

    - name: '[OIDC] Ensure NPM 11.5.1+'
      if: inputs.token == ''
      shell: bash
      run: |
        current_npm=$(npm --version)
        required="11.5.1"
        if [ "$(printf '%s\n' "$required" "$current_npm" | sort -V | head -n1)" = "$required" ]; then
          echo "npm $current_npm is already >= $required"
        else
          echo "npm $current_npm is below $required, upgrading via corepack"
          corepack enable
          corepack install -g npm@$required
        fi

    - name: '[API Token] Login'
      if: inputs.token != ''
      shell: bash
      run: |
        echo "//registry.npmjs.org/:_authToken=${{ inputs.token }}" > ~/.npmrc

    # npm reads NPM_CONFIG_PROVENANCE and pnpm 11 reads only PNPM_CONFIG_PROVENANCE,
    # so a preference given through any of the three is applied to both, and callers
    # get the same behaviour whichever package manager they publish with.
    - name: Resolve provenance
      shell: bash
      env:
        PROVENANCE_INPUT: ${{ inputs.provenance }}
      run: |
        if [[ "$PROVENANCE_INPUT" == "false" || "${NPM_CONFIG_PROVENANCE:-}" == "false" || "${PNPM_CONFIG_PROVENANCE:-}" == "false" ]]; then
          provenance=false
        elif [[ "$PROVENANCE_INPUT" == "true" || "${NPM_CONFIG_PROVENANCE:-}" == "true" || "${PNPM_CONFIG_PROVENANCE:-}" == "true" ]]; then
          provenance=true
        else
          echo "No provenance preference given, leaving it to the package manager"
          exit 0
        fi

        echo "Publishing with provenance=$provenance"
        {
          echo "NPM_CONFIG_PROVENANCE=$provenance"
          echo "PNPM_CONFIG_PROVENANCE=$provenance"
        } >> "$GITHUB_ENV"

    - name: Publish
      shell: bash
      run: |
        file_content=$(cat "${{ inputs.path }}/package.json")

        name=$(echo "$file_content" | jq -r ".name")
        version=$(echo "$file_content" | jq -r ".version")

        echo "name: $name"
        echo "version: $version"

        package_ref="$name@$version"

        package_manager="${{ inputs.package_manager }}"
        if [[ "$package_manager" != "pnpm" && "$package_manager" != "npm" ]]; then
          echo "Unsupported package manager: $package_manager"
          exit 1
        fi

        if npm view "$package_ref" > /dev/null 2>&1 ; then
          echo "Package $package_ref already published"
          exit 0
        fi


        echo "Publishing version $package_ref"
        echo "Using $package_manager as package manager"

        cd "${{ inputs.path }}" || exit 1
        cmd="$package_manager publish --access public"

        if [ "$package_manager" = "pnpm" ]; then
          cmd="$cmd --publish-branch ${{ github.ref_name }}"
        fi

        eval "$cmd"
